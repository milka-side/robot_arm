moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Raised above the defaults (1.2 / 0.5s) — real moves need more slack
# than the planned execution time model predicts.
trajectory_execution:
  allowed_execution_duration_scaling: 3.0
  allowed_goal_duration_margin: 5.0

moveit_simple_controller_manager:
  controller_names:
    - robot_arm_controller

  robot_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
    - arm_mount_base_joint
    - arm_base_shoulder_joint
    - arm_shoulder_forearm_joint
    - arm_forearm_wrist_1_joint
    - arm_wrist_1_wrist_2_joint
    - arm_wrist_2_end_effector_joint 